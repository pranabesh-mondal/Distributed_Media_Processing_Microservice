services:
  api:
    build: .
    image: media-processing:latest
    container_name: media_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: media-processing:latest
    container_name: media_worker
    command: celery -A app.workers.celery_worker worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # CPU-heavy media work: scale replicas rather than raising concurrency.
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus:latest
    container_name: media_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    container_name: media_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: media_rabbitmq
    ports:
      - "5672:5672"     # AMQP (Celery broker)
      - "15672:15672"   # Management UI (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5